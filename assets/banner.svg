  <title>XXD Panel 045</title>
  <desc>Deconstruct, select, distil, and rebuild the source as a gentle isometric block sculpture whose rounded tactile modules preserve its distinctive volume, axis, curves, interlocks, overlaps, occlusions, and negative spaces without literal LEGO copying or pixelisation.</desc>
